<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Music — Personal Website</title>
		<style>
			:root {
				--paper: #090b12;
				--ink: #f3efe8;
				--muted: #dce5f4;
				--panel: #141b2b;
				--line: rgba(170, 190, 255, 0.45);
			}

			* {
				box-sizing: border-box;
			}

			body {
				font-family: times, serif;
				margin: 0;
				min-height: 100vh;
				background: var(--paper);
				color: var(--ink);
			}

			main {
				max-width: 900px;
				margin: 0 auto;
				padding: 4rem 1rem 5rem;
				text-align: center;
			}

			.home-link {
				position: fixed;
				top: 1.25rem;
				left: 1.25rem;
				z-index: 10;
			}

			h1 {
				margin: 0 0 1rem;
				color: #edf4ff;
				font-size: clamp(2.5rem, 5vw, 4rem);
				font-weight: 400;
			}

			h2 {
				margin: 1.5rem 0 1rem;
				color: #dfe9ff;
				font-size: clamp(1.5rem, 3vw, 2.25rem);
				font-weight: 400;
			}

			.video-wrap {
				position: relative;
				max-width: 760px;
				margin: 1.5rem auto 10rem;
				padding: 0.5rem;
				background: rgba(14, 18, 28, 0.8);
				border: 1px solid var(--line);
				border-radius: 12px;
				overflow: hidden;
			}

			.video-overlay {
				position: absolute;
				inset: 0.5rem;
				background: url('images/question marks.gif') center center / cover no-repeat;
				border-radius: 8px;
				z-index: 2;
				opacity: 1;
				transition: opacity 0.25s ease;
				pointer-events: none;
			}

			.video-wrap.is-playing .video-overlay {
				opacity: 0;
			}

			.button-row {
				display: flex;
				justify-content: center;
				gap: 1rem;
				flex-wrap: wrap;
				margin-top: 2rem;
			}

			.play-button {
				display: inline-flex;
				align-items: center;
				justify-content: center;
				width: 110px;
				height: 110px;
				margin: 0;
				padding: 0;
				background: #101827;
				border: 1px solid var(--line);
				border-radius: 10px;
				color: var(--muted);
				font-family: times, serif;
				font-size: 1.1rem;
				cursor: pointer;
				overflow: hidden;
				transition: transform 0.2s ease, background 0.2s ease;
			}

			.play-button img {
				display: block;
				width: 100%;
				height: 100%;
				object-fit: cover;
				object-position: center;
			}

			.play-button:hover {
				background: #f1e8d5;
				transform: translateY(-1px);
			}

			.play-button:focus-visible {
				outline: 2px solid var(--muted);
				outline-offset: 3px;
			}

			.tooltip {
				position: fixed;
				left: 0;
				top: 0;
				transform: translate(12px, 18px);
				background: rgba(9, 11, 18, 0.92);
				color: #edf4ff;
				border: 1px solid var(--line);
				border-radius: 6px;
				padding: 0.35rem 0.55rem;
				font-size: 0.8rem;
				letter-spacing: 0.02em;
				pointer-events: none;
				opacity: 0;
				transition: opacity 0.12s ease;
				z-index: 50;
				white-space: nowrap;
			}

			.tooltip.visible {
				opacity: 1;
			}

			video {
				display: block;
				width: 100%;
				height: auto;
				border-radius: 8px;
				background: #000;
			}

			a {
				color: #dfe9ff;
				font-size: 1.1rem;
				text-decoration: none;
			}

			a:hover {
				text-decoration: underline;
			}
		</style>
	</head>
	<body>
		<main>
			<h1>My Music</h1>
			<h2>Choose a song!</h2>
			<div class="button-row">
				<button class="play-button" type="button" data-video="images/Clown Song (Round and Round) - Noonie.mp4" aria-label="Play Clown Song">
					<img src="images/cs.jpg" alt="Clown Song" />
				</button>
				<button class="play-button" type="button" data-video="images/Hypnotic Fantasy - Music Video.mp4" aria-label="Play Hypnotic Fantasy">
					<img src="images/hypf.png" alt="Hypnotic Fantasy" />
				</button>
				<button class="play-button" type="button" data-video="images/Your Real Friend (Unofficial music video) by Noonie.mp4" aria-label="Play Your Real Friend">
					<img src="images/yrf.png" alt="Your Real Friend" />
				</button>
			</div>
			<div class="video-wrap" id="video-wrap">
				<div class="video-overlay" aria-hidden="true"></div>
				<video id="clown-video" controls playsinline preload="metadata" style="position: relative; z-index: 1;">
					<source src="images/Clown Song (Round and Round) - Noonie.mp4" type="video/mp4" />
					Your browser does not support the video tag.
				</video>
			</div>
			<a class="home-link" href="index.html">← Back to Home</a>
		</main>
		<div class="tooltip" id="song-tooltip" aria-hidden="true"></div>
		<script>
			const video = document.getElementById('clown-video');
			const videoWrap = document.getElementById('video-wrap');
			const buttons = document.querySelectorAll('.play-button');
			const tooltip = document.getElementById('song-tooltip');

			buttons.forEach((button) => {
				const label = button.getAttribute('aria-label') || button.textContent.trim();
				button.addEventListener('mouseenter', (event) => {
					tooltip.textContent = label.replace('Play ', '');
					tooltip.classList.add('visible');
					tooltip.style.left = `${event.clientX}px`;
					tooltip.style.top = `${event.clientY}px`;
				});

				button.addEventListener('mousemove', (event) => {
					tooltip.style.left = `${event.clientX}px`;
					tooltip.style.top = `${event.clientY}px`;
				});

				button.addEventListener('mouseleave', () => {
					tooltip.classList.remove('visible');
				});

				button.addEventListener('click', () => {
					const source = button.getAttribute('data-video');
					const sourceElement = video.querySelector('source');
					sourceElement.setAttribute('src', source);
					video.load();
					videoWrap.classList.add('is-playing');
					video.play();
				});
			});

			video.addEventListener('pause', () => {
				if (video.currentTime === 0) {
					videoWrap.classList.remove('is-playing');
				}
			});
		</script>
	</body>
</html>
