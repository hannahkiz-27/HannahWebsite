    <script>
      document.querySelectorAll('.top-left-fish a img').forEach(img => {
        img.addEventListener('mouseenter', () => {
          const angle = (Math.random() * 20 - 10).toFixed(2) + 'deg';
          img.style.setProperty('--fish-hover-rotate', angle);
        });
        img.addEventListener('mouseleave', () => {
          img.style.removeProperty('--fish-hover-rotate');
        });
      });
